services:
  - type: web
    name: learning-platform-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL_OVERRIDE
        fromDatabase:
          name: learning-platform-db
          property: connectionString

  - type: web
    name: learning-platform-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: learning-platform-db
    databaseName: learning_platform
    user: postgres
    region: oregon
    plan: free
    ipAllowList: []
