# ==============================================================================
# Redis Server Configuration
# ==============================================================================

# Bind to all network interfaces inside Docker container
bind 0.0.0.0
protected-mode yes
port 6379

# Password Authentication
requirepass redis_dev_password

# Persistence
appendonly yes
appendfsync everysec

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
